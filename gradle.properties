org.gradle.jvmargs = -Xmx3G
org.gradle.caching = true

archives_base_name = CreateDieselGenerators
# Same mod version as the Fabric port this is built from; the loader goes in the suffix.
mod_version = 1.3.15.3
mc_line = 26.2
maven_group = com.jesz.createdieselgenerators

minecraft_version = 26.2
minecraft_version_range = [26.2]

# Same toolchain as the Create Fly NeoForge port this depends on (branch port/neoforge-26.2).
moddev_version = 2.0.148
neoforge_version = 26.2.0.93
neoforge_version_range = [26.2.0.93,)

# The NeoForge build of Create Fly. CI builds it from port/neoforge-26.2 into this directory;
# locally, point it at a checkout's build/libs (-Pcreate_fly_libs=...).
create_fly_libs = ../mod-ported/build/libs
create_fly_version_range = [6.0.9,)
