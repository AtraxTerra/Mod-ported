org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true

# Mod properties
mod_version = 3.0.29
mod_id = dragonlib
maven_group = de.mrjulsen.mcdragonlib
archives_name = dragonlib
enabled_platforms = neoforge
java_version = 25
datapack_version = 48

# Mod Info
display_name = DragonLib
authors = MrJulsen
description = DragonLib is a small and simple Multiloader Minecraft Library Mod which uses architectury and adds useful tools for all my mods. This mod adds nothing special on its own. New functionality may be added at any time when needed by my mods. If you are developer feel free to use this library in your projects.
homepage = https://wiki.mrjulsen.net/dragonlib
issues = https://github.com/MisterJulsen/MC-DragonLib2/issues
source = https://github.com/MisterJulsen/MC-DragonLib2
license = GNU Lesser General Public License v3.0
icon = icon.png
discord = https://discord.mrjulsen.net

# Minecraft properties (NeoForge 26.2 port; upstream: 1.21.1 with Parchment mappings. 26.2 ships
# Mojang names, so there are no mappings to layer.)
minecraft_version = 26.2
next_unsupported_minecraft_version = 26.3

# Dependencies (NeoForge 26.2 port, same NeoForge as the Create Fly port of this repository).
# Architectury 21.1.12 is the 26.2 build the server already runs.
architectury_api_version = 21.1.12
neoforge_version = 26.2.0.93
neoforge_loader_version = 1
neoforge_dependency_version = 26.2.0.93
