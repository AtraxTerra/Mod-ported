# Gradle
org.gradle.jvmargs             = -Xmx4G
org.gradle.parallel            = true
org.gradle.configuration-cache = false

# ---------------------------------------------------------------------------
# Minecraft / NeoForge
# ---------------------------------------------------------------------------
# 26.2 baseline: Java 25, mojmap (no remap), resource pack format 88,
# data pack format 107. NeoForge 26.2.x is a STABLE line.
minecraft_version              = 26.2
# Minimum NeoForge build this mod is built and tested against.
neoforge_version               = 26.2.0.93
# Accepted range at runtime -- deliberately wide so a newer 26.2 build still loads.
neoforge_version_range         = [26.2.0.88,27)
minecraft_version_range        = [26.2,26.3)

# ---------------------------------------------------------------------------
# !! VERIFY THIS BEFORE THE FIRST BUILD !!
# ModDevGradle is the canonical NeoForge toolchain plugin. This value could not
# be resolved offline when the project was generated. Check the latest at
#   https://projects.neoforged.net/neoforged/moddevgradle
# and bump it here if the build fails to resolve the plugin.
# ---------------------------------------------------------------------------
moddev_version                 = 2.0.78

# ---------------------------------------------------------------------------
# Mod properties
# ---------------------------------------------------------------------------
mod_id                         = create
mod_name                       = Create Fly
mod_version                    = 6.0.9
# Upstream calls this "mod_id"; it is really a build counter appended to the
# version string (version = "<mod_version>-<build_number>").
build_number                   = 1
maven_group                    = com.zurrtum
archives_base_name             = create-fly

# ---------------------------------------------------------------------------
# Optional compile-only integrations. All are OFF by default: each one needs a
# NeoForge-side equivalent to be wired up first (see PORTING.md).
# ---------------------------------------------------------------------------
enable_jei                     = false
jei_version                    =
enable_cct                     = false
cct_version                    =
