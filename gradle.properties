org.gradle.jvmargs = -Xmx3G
org.gradle.caching = true

archives_base_name = Trackwright
mod_version = 1.2.2
mc_line = 26.2
maven_group = dev.chaevsfe.trackwright

minecraft_version = 26.2

# NeoForge build (port/trackwright-neoforge-26.2), same versions as the Create Fly NeoForge port.
neoforge_version = 26.2.0.93
neoforge_version_range = [26.2.0.93,)
minecraft_version_range = [26.2]
moddev_version = 2.0.148

# The NeoForge port of Create Fly (port/neoforge-26.2 of this repository), built as a plain jar.
# CI passes -Pcreate_fly_libs=deps/create-fly/build/libs.
create_fly_libs = ../mod-ported/build/libs
# Upstream: Create Fly >=6.0.9-1 <=6.0.9-2.
create_fly_version_range = [6.0.9,6.0.10)
