# DragonLib on NeoForge 26.2: upstream's access widener (common/src/main/resources/dragonlib.accesswidener)
# as an access transformer. Architectury converted the widener at remapJar time; ModDevGradle reads
# this file instead (build.gradle.kts), and NeoForge applies it at runtime.
#
# Widener lines with no 26.2 counterpart are not carried over: Font$StringRenderOutput (text layout is
# Font$PreparedText now), ModelBlockRenderer$AmbientOcclusionFace with its brightness and lightmap
# fields, ModelBakery#bakedCache and ModelBakery$BakedCacheKey (the 26.2 model baker caches
# differently). The code that used them is ported against the 26.2 API instead.
public net.minecraft.client.gui.screens.Screen renderables
