# Interpolated by generateModMetadata in build.gradle. Converted from the Fabric fabric.mod.json.
license = "MIT"
issueTrackerURL = "https://github.com/AtraxTerra/Mod-ported/issues"

[[mods]]
modId = "createdieselgenerators"
version = "${mod_version}"
displayName = "Create Fly: Diesel Generators"
authors = "George VI, chaevsfe"
credits = "Create: Diesel Generators by George VI; the Create Fly port by chaevsfe; NeoForge port in AtraxTerra/Mod-ported"
displayURL = "https://github.com/chaevsfe/Create-Diesel-Generators"
iconFile = "icon.png"
description = '''
Create: Diesel Generators for Create Fly 26.2, on NeoForge. Oil prospecting and extraction,
distillation and fermentation, and a family of diesel engines that burn the fuels you refine.
'''

[[mixins]]
config = "createdieselgenerators.mixins.json"

# Client mixins live in that config's "client" array; a dedicated server never applies them.
[[mixins]]
config = "createdieselgenerators.client.mixins.json"

[[dependencies.createdieselgenerators]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.createdieselgenerators]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Create Fly (NeoForge). Loaded first: this mod registers through Create's plugin hooks.
[[dependencies.createdieselgenerators]]
modId = "create"
type = "required"
versionRange = "${create_fly_version_range}"
ordering = "AFTER"
side = "BOTH"

[[dependencies.createdieselgenerators]]
modId = "jei"
type = "optional"
versionRange = "*"
ordering = "NONE"
side = "BOTH"
