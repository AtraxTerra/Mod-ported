# Interpolated by the generateModMetadata task in build.gradle. The ${} values come from
# gradle.properties; a missing one fails the build rather than shipping a literal placeholder.
#
# Note for anyone comparing this against an older NeoForge mod: 26.2 no longer takes the
# modLoader / loaderVersion keys that Forge-era and early NeoForge files carried, and the access
# transformer is auto-detected at META-INF/accesstransformer.cfg rather than declared here. Both
# match the official MDK-26.2-ModDevGradle template.
license = "CC0-1.0"
issueTrackerURL = "https://github.com/AtraxTerra/Mod-ported/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version_full}"
displayName = "${mod_name}"
authors = "ZurrTum"
credits = "Creators-of-Create, ZurrTum (the Fabric port this is derived from)"
iconFile = "assets/pack.png"
description = '''
Create, ported forward to Minecraft 26.2. This build targets NeoForge and is
derived from ZurrTum's Create Fly Fabric source.
'''

# Common mixins, applied on both the client and the dedicated server.
[[mixins]]
config = "create.mixins.json"

# Client mixins. NeoForge has no per-entry environment key: the client-only scoping lives inside
# the config itself, whose classes sit in its "client" array rather than "mixins". A dedicated
# server never loads that array.
[[mixins]]
config = "create.client.mixins.json"

[[dependencies.create]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.create]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
