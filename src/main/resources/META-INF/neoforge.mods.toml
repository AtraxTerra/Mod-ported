modLoader = "javafml"
loaderVersion = "[1,)"
license = "CC0-1.0"
issueTrackerURL = "https://github.com/AtraxTerra/Mod-ported/issues"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
authors = "ZurrTum"
credits = "Creators-of-Create, ZurrTum (Fabric port this is derived from)"
logoFile = "assets/pack.png"
description = '''
Create, ported forward to Minecraft 26.2. This build targets NeoForge and is
derived from ZurrTum's Create Fly Fabric source.
'''

# Converted from the upstream Fabric access widener by tools/aw2at.py.
[[accessTransformers]]
file = "META-INF/accesstransformer.cfg"

# Common mixins. Applied on both the client and the dedicated server.
[[mixins]]
config = "create.mixins.json"

# Client mixins. NeoForge has no per-entry environment key: the client-only
# scoping lives inside the config itself, whose classes sit in its "client"
# array rather than "mixins". A dedicated server never loads that array.
[[mixins]]
config = "create.client.mixins.json"

[[dependencies.create]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.create]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
