name: Build (DragonLib, NeoForge)

# Builds the NeoForge 26.2 port of DragonLib (the library Create Railways Navigator needs). DragonLib
# does not depend on Create; the Create Fly NeoForge port (port/neoforge-26.2) is checked out only for
# its CI tools (mixin audit, boot tests), like the Trackwright and Steam 'n' Rails ports.

on:
  push:
    branches: ['port/dragonlib-neoforge-26.2', 'feat/dragonlib-neoforge']
  pull_request:
    branches: ['port/dragonlib-neoforge-26.2']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dragonlib-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only used by the release step
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Check out the Create Fly NeoForge port (CI tools only)
        uses: actions/checkout@v4
        with:
          ref: port/neoforge-26.2
          path: deps/create-fly
          sparse-checkout: tools

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile
        id: compile
        shell: bash
        continue-on-error: true
        run: |
          chmod +x ./gradlew
          ./gradlew clean compileJava --console=plain 2>&1 | tee compile.log
          ls -la build/moddev/artifacts || true

      - name: Summarise compile errors
        if: always()
        shell: bash
        run: |
          total=$(grep -cE '^/.*\.java:[0-9]+: error:' compile.log || true)
          {
            echo "## Compile"
            if [ "${{ steps.compile.outcome }}" = "success" ]; then
              echo ":white_check_mark: \`compileJava\` succeeded."
            else
              echo ":x: compilation failed with **${total:-0}** error(s)."
              echo
              echo '```'
              if [ "${total:-0}" -eq 0 ]; then
                sed -n '/What went wrong/,/^\* Get more help/p' compile.log | head -40
              else
                grep -E '^/.*\.java:[0-9]+: error:' compile.log | sed "s|^${GITHUB_WORKSPACE}/||" | head -150
              fi
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "TOTAL_ERRORS=${total:-0}"
          grep -E '^/.*\.java:[0-9]+: error:' -A2 compile.log | sed "s|^${GITHUB_WORKSPACE}/||" || true
          sed -n '/What went wrong/,/^\* Get more help/p' compile.log | head -40 || true

      # Port reference: signatures (javap -p, private members included so mixin targets can be
      # checked) of the 26.2 classes the port reads, from the exact jar this build compiles against.
      # The list is .github/port/api-classes.txt.
      - name: API reference
        if: always()
        shell: bash
        run: |
          mc=$(find build/moddev/artifacts -name 'minecraft-patched-*.jar' | grep -v sources | head -1)
          nf=$(find ~/.gradle/caches -name 'neoforge-26.2*-universal.jar' | head -1)
          arch=$(find ~/.gradle/caches -name 'architectury-neoforge-*.jar' | grep -v sources | head -1)
          echo "minecraft: $mc  neoforge: $nf  architectury: $arch"
          set +e
          mkdir -p api-parts
          export CP="$mc:$nf:$arch"
          grep -vE '^\s*(#|$)' .github/port/api-classes.txt | nl -nrz -w4 | \
            xargs -P 8 -L 1 bash -c 'javap -p -cp "$CP" "$1" > "api-parts/$0.txt" 2>&1; true'
          grep -vE '^\s*(#|$)' .github/port/api-classes.txt | nl -nrz -w4 | while read -r n cls; do
            echo "=== API $cls"
            sed 's/^/API| /' "api-parts/$n.txt"
          done > api-reference.txt
          wc -l api-reference.txt
          cat api-reference.txt

      - name: Upload the compile log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dragonlib-compile-log-${{ github.sha }}
          path: |
            compile.log
            api-reference.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Fail if compilation failed
        if: steps.compile.outcome != 'success'
        run: exit 1

      - name: Build jar
        run: ./gradlew build --console=plain

      # Every injector, accessor and shadow of every mixin, read against the bytecode NeoForge runs
      # (client mixins included, which a server boot never applies).
      - name: Mixin target audit (bytecode)
        id: mixin-audit
        shell: bash
        continue-on-error: true
        run: |
          mc=$(find build/moddev/artifacts -name 'minecraft-patched-*.jar' | head -1)
          dl=$(ls build/libs/dragonlib-neoforge-*.jar | grep -v sources | head -1)
          echo "auditing against $mc and $dl"
          # The audit reads annotations with regular expressions and does not skip comments, so it
          # reads a copy of the sources with the comments blanked out (upstream keeps disabled
          # injectors in block comments).
          python3 -I - <<'PY'
          import pathlib, re
          src, dst = pathlib.Path('common/src/main/java'), pathlib.Path('build/audit-src')
          token = re.compile(r'"(?:\\.|[^"\\])*"|\'(?:\\.|[^\'\\])\'|/\*.*?\*/|//[^\n]*', re.S)
          for f in src.rglob('*.java'):
              text = token.sub(lambda m: m.group(0) if m.group(0)[0] in '"\'' else '\n' * m.group(0).count('\n'), f.read_text(encoding='utf-8'))
              out = dst / f.relative_to(src)
              out.parent.mkdir(parents=True, exist_ok=True)
              out.write_text(text, encoding='utf-8')
          PY
          python3 -I deps/create-fly/tools/audit_mixin_targets.py --src build/audit-src --resources common/src/main/resources \
            --classes build/classes/java/main --jar "$mc" --jar "$dl" | tee mixin-audit.log || true

      - name: Upload jars
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dragonlib-neoforge-${{ github.sha }}
          path: |
            build/libs/*.jar
            mixin-audit.log
          if-no-files-found: warn
          retention-days: 30

      # Every push replaces the "dragonlib-latest" pre-release with the jar just built.
      - name: Publish the dragonlib-latest pre-release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jars=$(ls build/libs/dragonlib-neoforge-*.jar | grep -v -- '-sources')
          cat > notes.md <<'NOTES'
          **DragonLib** (bibliothèque requise par Create Railways Navigator) sur NeoForge 26.2 (26.2.0.93 ou plus récent).

          Dépend d'Architectury API 21.1.12 ou plus récent pour 26.2 (déjà sur le serveur). À mettre sur le serveur **et** sur chaque client, avec le mod qui l'utilise.
          Pré-version : vérifiée en CI (compilation, mixins, démarrage du serveur et du client).
          NOTES
          sed -i 's/^          //' notes.md
          echo "" >> notes.md
          echo "Construit depuis \`${GITHUB_SHA:0:8}\` (${GITHUB_REF_NAME})." >> notes.md
          gh release delete dragonlib-latest --repo "$GITHUB_REPOSITORY" --cleanup-tag -y 2>/dev/null || true
          gh release create dragonlib-latest $jars --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "DragonLib, NeoForge 26.2 (dernière version)" --notes-file notes.md

      - name: Boot a dedicated server with DragonLib
        id: boot
        continue-on-error: true
        shell: bash
        run: |
          cp deps/create-fly/tools/boot-test.sh tools-boot-test.sh
          chmod +x tools-boot-test.sh
          ./tools-boot-test.sh 600

      - name: Server log (errors)
        if: always()
        shell: bash
        run: |
          # The boot logs cannot be downloaded from here, so show what matters in the job log: every
          # error line, then each distinct stack trace (its first 40 lines, Gradle frames left out).
          for f in run/logs/latest.log boot-test.log; do
            [ -f "$f" ] || continue
            echo "::group::$f: errors"
            grep -nE '\[(main|Server thread|Render thread|modloading-worker-[0-9]+)/(ERROR|FATAL)\]|^Caused by|Exception( in|:)' "$f" \
              | grep -vE 'org\.gradle\.' | head -80
            echo "::endgroup::"
            echo "::group::$f: stack traces"
            awk '/(Exception|Error)(:|$)/ && !/org\.gradle\./ { if (!seen[$0]++) { n = 40 } } n > 0 && !/at org\.gradle\./ { print; n-- }' "$f" | head -200
            echo "::endgroup::"
          done
          for c in run/crash-reports/*.txt; do
            [ -f "$c" ] || continue
            echo "::group::$c"; head -100 "$c"; echo "::endgroup::"
          done
          true

      - name: Client boot (headless)
        id: client
        continue-on-error: true
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 libegl1 mesa-utils
          rm -rf run/crash-reports run/logs
          cp deps/create-fly/tools/client-boot-test.sh tools-client-boot-test.sh
          xvfb-run -a -s "-screen 0 1280x720x24" bash tools-client-boot-test.sh 1500 60
          echo "## Client boot" >> "$GITHUB_STEP_SUMMARY"
          tail -25 client-boot-test.log >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Client log (errors)
        if: always()
        shell: bash
        run: |
          # The boot logs cannot be downloaded from here, so show what matters in the job log: every
          # error line, then each distinct stack trace (its first 40 lines, Gradle frames left out).
          for f in run/logs/latest.log client-boot-test.log; do
            [ -f "$f" ] || continue
            echo "::group::$f: errors"
            grep -nE '\[(main|Server thread|Render thread|modloading-worker-[0-9]+)/(ERROR|FATAL)\]|^Caused by|Exception( in|:)' "$f" \
              | grep -vE 'org\.gradle\.' | head -80
            echo "::endgroup::"
            echo "::group::$f: stack traces"
            awk '/(Exception|Error)(:|$)/ && !/org\.gradle\./ { if (!seen[$0]++) { n = 40 } } n > 0 && !/at org\.gradle\./ { print; n-- }' "$f" | head -200
            echo "::endgroup::"
          done
          for c in run/crash-reports/*.txt; do
            [ -f "$c" ] || continue
            echo "::group::$c"; head -100 "$c"; echo "::endgroup::"
          done
          true

      - name: Upload the boot logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dragonlib-boot-log-${{ github.sha }}
          path: |
            boot-test.log
            client-boot-test.log
            run/logs/*.log
            run/crash-reports/*.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Fail if a boot failed
        if: always()
        shell: bash
        run: |
          fail=0
          grep -qE 'Done \([0-9.]+s\)' boot-test.log 2>/dev/null || { echo "::error::the dedicated server never reached Done"; fail=1; }
          grep -qE 'Created: [0-9]+x[0-9]+x[0-9]+ minecraft:(textures/atlas/)?blocks' client-boot-test.log 2>/dev/null \
            || { echo "::error::the client never finished loading its resources"; fail=1; }
          if grep -qE 'FAILED during APPLY|was not applied|InvalidInjectionException' boot-test.log client-boot-test.log 2>/dev/null; then
            echo "::error::mixin failures in the boot logs"; fail=1
          fi
          exit $fail
