name: Build

# The point of this workflow, beyond producing a jar: GitHub runners can reach the NeoForged and
# Mojang Maven repositories, which the environment this port was written in could not. This is the
# first place the code is actually compiled, so the error summary below is the real deliverable
# until the build goes green.

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push supersedes an in-flight build of the same ref.
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        # Minecraft 26.x requires Java 25 on every loader.
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != format('refs/heads/{0}', 'port/neoforge-26.2') }}

      - run: chmod +x ./gradlew

      # Data the port keeps in step with upstream code by hand. Cheap, no Gradle, and a mismatch is
      # silent at runtime (an item just stops burning), so it fails the build.
      - name: Port consistency checks
        run: python3 -I tools/check_fuels.py src/main/java src/main/resources

      # Compile on its own first. A green compile proves nothing about mixins or runtime, but a
      # failing one makes everything after it noise, and this keeps the failure easy to find.
      - name: Compile
        id: compile
        # `shell: bash` is load-bearing: it adds `-o pipefail`, which the default shell does not
        # set. Without it the exit status of the pipeline is tee's, so a failing Gradle run would
        # be reported as a successful step and the build would carry on past a broken compile.
        shell: bash
        run: ./gradlew clean compileJava --stacktrace --console=plain 2>&1 | tee compile.log
        continue-on-error: true

      - name: Summarise compile errors
        if: always()
        run: |
          {
            echo "## Compile"
            if [ "${{ steps.compile.outcome }}" = "success" ]; then
              echo
              echo ":white_check_mark: \`compileJava\` succeeded."
            else
              total=$(grep -cE '^/.*\.java:[0-9]+: error:' compile.log || true)
              if [ "${total:-0}" -eq 0 ]; then
                # No javac errors means Gradle itself failed -- a dependency that would not
                # resolve, a plugin API that moved, a NeoForm step that died. Different problem,
                # different place to look, so show that instead of an empty error table.
                echo
                echo ":x: \`compileJava\` failed **before javac ran** — no Java errors were"
                echo "reported, so this is a Gradle or toolchain failure rather than a code one."
                echo
                echo '```'
                sed -n '/What went wrong/,/^\* Get more help/p' compile.log | head -40
                echo '```'
                exit 0
              fi
              echo
              echo ":x: \`compileJava\` failed with **${total}** error(s)."
              echo
              echo "### Errors by file"
              echo
              echo '| errors | file |'
              echo '|---|---|'
              grep -oE '^/.*\.java:[0-9]+: error:' compile.log \
                | sed -E 's/:[0-9]+: error:$//' \
                | sed "s|^${GITHUB_WORKSPACE}/||" \
                | sort | uniq -c | sort -rn | head -40 \
                | awk '{printf "| %s | `%s` |\n", $1, $2}'
              echo
              echo "### First 60 errors"
              echo
              echo '```'
              grep -E '^/.*\.java:[0-9]+: error:' -A2 compile.log \
                | sed "s|^${GITHUB_WORKSPACE}/||" | head -180
              echo '```'
              echo
              echo "See PORTING.md section 3 for the order to work through these, and the list of"
              echo "NeoForge signatures most likely to have moved between versions."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if compilation failed
        if: steps.compile.outcome != 'success'
        run: exit 1

      # Gates 3 and 4 at bytecode level: every injector's method and @At target, checked against
      # the patched Minecraft jar ModDevGradle just produced. Unlike the boot test it covers the
      # CLIENT mixins too, and it reports every failure at once instead of one per server launch.
      # Report-only for now, like the boot test; flip continue-on-error off once it is clean.
      - name: Mixin target audit (bytecode)
        id: mixin-audit
        shell: bash
        continue-on-error: true
        run: |
          # Prefer the joined (client + server) jar so client mixins are covered too. Look in
          # ModDevGradle's own output first; the Gradle cache is only a fallback (it is large).
          mc=""
          pick() {
            while IFS= read -r jar; do
              if unzip -l "$jar" 2>/dev/null | grep -q 'net/minecraft/world/entity/LivingEntity.class'; then
                echo "candidate: $jar"
                if unzip -l "$jar" | grep -q 'net/minecraft/client/Minecraft.class'; then mc="$jar"; fi
                if [ -z "$mc" ]; then mc="$jar"; fi
              fi
            done
            return 0  # bash -e: never let a false test leak out as the function's status
          }
          pick < <(find build/moddev -name '*.jar' ! -name '*sources*' 2>/dev/null)
          if [ -z "$mc" ]; then pick < <(find "$HOME/.gradle/caches" -name '*.jar' ! -name '*sources*' \
            \( -iname '*neoforge*' -o -iname '*minecraft*' \) 2>/dev/null); fi
          if [ -z "$mc" ]; then
            echo "::warning::no patched Minecraft jar found; jars under build/moddev:"
            find build/moddev -name '*.jar' 2>/dev/null
            exit 1
          fi
          echo "auditing against $mc"
          python3 -I tools/audit_mixin_targets.py --src src/main/java --resources src/main/resources \
            --classes build/classes/java/main --jar "$mc" | tee mixin-audit.log

      - name: Summarise mixin audit
        if: always() && steps.mixin-audit.outcome != 'skipped'
        run: |
          {
            echo "## Mixin target audit"
            echo
            if [ "${{ steps.mixin-audit.outcome }}" = "success" ]; then
              echo ":white_check_mark: every checked injector target exists in the patched bytecode."
            else
              echo ":x: injectors whose target is missing from the patched bytecode (each one fails Mixin's apply step):"
            fi
            echo
            echo '```'
            cat mixin-audit.log 2>/dev/null | head -200
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build jar
        run: ./gradlew build --stacktrace --console=plain

      - name: Upload jars
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: create-fly-neoforge-${{ github.sha }}
          path: |
            build/libs/*.jar
          if-no-files-found: warn
          retention-days: 30

      - name: Upload compile log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compile-log-${{ github.sha }}
          path: compile.log
          retention-days: 14

  boot-test:
    # Gate 2 of the validation stack: does the dedicated server actually start?
    #
    # A green compile says nothing about mixins -- they are applied by name at class load, so one
    # targeting a member that moved compiles fine and fails the moment the class is touched. This
    # is the authoritative check for the 71 COMMON mixins.
    #
    # It does NOT block the build yet: the port has never been run, so the first failures here are
    # expected and should not hide a working jar. Flip continue-on-error off once it passes.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - run: chmod +x ./gradlew tools/boot-test.sh

      - name: Boot the dedicated server
        run: tools/boot-test.sh 600

      - name: Upload the boot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-log-${{ github.sha }}
          path: |
            boot-test.log
            run/logs/*.log
            run/crash-reports/*.txt
          if-no-files-found: warn
          retention-days: 14

  client-boot-test:
    # Gates 4 and 5 as far as CI can take them: the client mixins actually applying, and every
    # model and texture resolving during the first resource reload (the bake gate). Headless:
    # Xvfb plus Mesa's software OpenGL. Report-only for now, like the server boot.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Install a virtual display and software OpenGL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 libegl1 mesa-utils
          xvfb-run -a glxinfo -B | grep -E "OpenGL (renderer|core profile version)" || true

      - run: chmod +x ./gradlew tools/client-boot-test.sh

      - name: Boot the client
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a -s "-screen 0 1280x720x24" tools/client-boot-test.sh 1200 45

      # Gate 7 and an in-world smoke test: place every Create block on a server, then have the
      # client join that world and render it. Runs even if the title-screen boot failed, so one CI
      # run reports both.
      - name: Place every Create block (server, RCON)
        if: always()
        run: |
          chmod +x tools/world-smoke.sh
          rm -rf run/crash-reports
          tools/world-smoke.sh ci 600

      - name: Join that world (client)
        if: always()
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          mv client-boot-test.log client-boot-title.log 2>/dev/null || true
          xvfb-run -a -s "-screen 0 1280x720x24" tools/client-boot-test.sh 1200 60 ci

      - name: Upload the client log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-boot-log-${{ github.sha }}
          path: |
            client-boot-test.log
            client-boot-title.log
            world-smoke.log
            world-smoke-results.tsv
            run/logs/*.log
            run/crash-reports/*.txt
          if-no-files-found: warn
          retention-days: 14

  release:
    # A tag pushed as v<something> publishes the jars as a GitHub release.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: create-fly-neoforge-${{ github.sha }}
          path: jars
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" jars/*.jar \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "Create Fly ported to NeoForge 26.2. See PORTING.md for known gaps."
