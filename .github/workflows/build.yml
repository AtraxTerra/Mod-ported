name: Build (Diesel Generators, NeoForge)

# Builds the NeoForge port of Create Fly: Diesel Generators against the NeoForge port of Create
# Fly, which lives on another branch of this repository (port/neoforge-26.2). That branch is built
# first, in deps/create-fly, and its jar is what this mod compiles against and runs with.

on:
  push:
    branches: ['port/cdg-neoforge-26.2']
  pull_request:
    branches: ['port/cdg-neoforge-26.2']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cdg-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Check out the Create Fly NeoForge port
        uses: actions/checkout@v4
        with:
          ref: port/neoforge-26.2
          path: deps/create-fly

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build Create Fly (NeoForge)
        shell: bash
        working-directory: deps/create-fly
        run: |
          chmod +x ./gradlew
          ./gradlew jar --console=plain
          ls -l build/libs

      # Datapack syntax never fails a build: a leftover fabric: key is a "Couldn't parse data file"
      # at server start, or a compat recipe that loads when its mod is absent.
      - name: No Fabric data left (load conditions, custom ingredients)
        run: |
          python3 -I deps/create-fly/tools/convert_fabric_data.py src/main/resources --check
          python3 -I deps/create-fly/tools/convert_fabric_data.py src/generated/resources --check

      - name: Compile
        id: compile
        shell: bash
        continue-on-error: true
        run: |
          chmod +x ./gradlew
          ./gradlew clean compileJava -Pcreate_fly_libs=deps/create-fly/build/libs --console=plain 2>&1 | tee compile.log

      - name: Summarise compile errors
        if: always()
        shell: bash
        run: |
          {
            echo "## Compile"
            if [ "${{ steps.compile.outcome }}" = "success" ]; then
              echo ":white_check_mark: \`compileJava\` succeeded."
            else
              total=$(grep -cE '^/.*\.java:[0-9]+: error:' compile.log || true)
              echo ":x: \`compileJava\` failed with **${total:-0}** error(s)."
              echo
              echo '```'
              if [ "${total:-0}" -eq 0 ]; then
                sed -n '/What went wrong/,/^\* Get more help/p' compile.log | head -40
              else
                grep -E '^/.*\.java:[0-9]+: error:' -A2 compile.log | sed "s|^${GITHUB_WORKSPACE}/||" | head -200
              fi
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E '^/.*\.java:[0-9]+: error:' -A2 compile.log | sed "s|^${GITHUB_WORKSPACE}/||" | head -300 || true

      - name: Fail if compilation failed
        if: steps.compile.outcome != 'success'
        run: exit 1

      - name: Mixin target audit (bytecode)
        id: mixin-audit
        shell: bash
        continue-on-error: true
        run: |
          mc=$(find build/moddev/artifacts -name 'minecraft-patched-*.jar' | head -1)
          fly=$(ls deps/create-fly/build/libs/create-fly-*.jar | grep -v sources | head -1)
          echo "auditing against $mc and $fly"
          python3 -I deps/create-fly/tools/audit_mixin_targets.py --src src/main/java --resources src/main/resources \
            --classes build/classes/java/main --jar "$mc" --jar "$fly" | tee mixin-audit.log

      - name: Build jar
        run: ./gradlew build -Pcreate_fly_libs=deps/create-fly/build/libs --console=plain

      - name: Upload jars
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: createdieselgenerators-neoforge-${{ github.sha }}
          path: |
            build/libs/*.jar
            deps/create-fly/build/libs/*.jar
          if-no-files-found: warn
          retention-days: 30

      - name: Boot a dedicated server with Create Fly + Diesel Generators
        id: boot
        continue-on-error: true
        shell: bash
        run: |
          cp deps/create-fly/tools/boot-test.sh tools-boot-test.sh 2>/dev/null || true
          chmod +x tools-boot-test.sh
          echo "create_fly_libs=deps/create-fly/build/libs" >> gradle.properties
          ./tools-boot-test.sh 600

      # The world this port is for ran "Create: Diesel Generators Adapted" on Create: Adapted. Same
      # test as Create Fly's migration-test job, with both mods on each side.
      - name: "World migration (Create: Adapted + Diesel Generators Adapted -> Create Fly + this port)"
        id: migration
        continue-on-error: true
        shell: bash
        env:
          MIGRATION_EXTRA_A: https://mediafilez.forgecdn.net/files/8879/67/createdieselgenerators-26.2-1.3.15-adapted-0.605.jar
          MIGRATION_BLOCKSTATES: src/generated/resources/assets/createdieselgenerators/blockstates
        run: |
          fly=$(ls deps/create-fly/build/libs/create-fly-*.jar | grep -v -- '-sources' | head -1)
          cdg=$(ls build/libs/createdieselgenerators-*.jar | grep -v -- '-sources' | head -1)
          echo "Create Fly: $fly / Diesel Generators: $cdg"
          bash deps/create-fly/tools/migration-test.sh "$fly" 26.2.0.93 "$cdg"

      # The survival server's whole mod list, with Create Fly and this port in place of the two
      # Adapted mods: does it all load together, server side and client side?
      - name: Fetch the survival server's other mods (Modrinth)
        id: modlist-fetch
        continue-on-error: true
        shell: bash
        run: python3 -I deps/create-fly/tools/fetch_server_mods.py deps/create-fly/tools/server-mods.txt modlist-mods

      - name: Server boot with the full mod list
        id: modlist-server
        continue-on-error: true
        shell: bash
        run: |
          fly=$(ls deps/create-fly/build/libs/create-fly-*.jar | grep -v -- '-sources' | head -1)
          cdg=$(ls build/libs/createdieselgenerators-*.jar | grep -v -- '-sources' | head -1)
          bash deps/create-fly/tools/modlist-boot-test.sh modlist-mods "$fly" "$cdg"

      - name: Client boot with the full mod list (headless)
        id: modlist-client
        continue-on-error: true
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 libegl1 mesa-utils
          rm -rf run/mods run/crash-reports run/logs
          mkdir -p run/mods && cp modlist-mods/*.jar run/mods/
          cp deps/create-fly/tools/client-boot-test.sh tools-client-boot-test.sh
          xvfb-run -a -s "-screen 0 1280x720x24" bash tools-client-boot-test.sh 1500 60
          echo "## Survival mod list + this port: client boot" >> "$GITHUB_STEP_SUMMARY"
          tail -25 client-boot-test.log >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Upload the boot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cdg-boot-log-${{ github.sha }}
          path: |
            boot-test.log
            client-boot-test.log
            modlist-server/server.log
            run/logs/*.log
            run/crash-reports/*.txt
          if-no-files-found: ignore
          retention-days: 14
